name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  version-pin:
    name: Immutable UHC version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check add-on and runtime versions
        run: ./test/version_pin_test.sh

  addon-lint:
    name: Add-on config lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./unified-hifi-control"
