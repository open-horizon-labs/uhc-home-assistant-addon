# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Unified Hi-Fi Control
version: "3.7.0-alpha.4"
slug: unified_hifi_control
description: >-
  Bridge Roon, LMS, UPnP/OpenHome, and HQPlayer to one control surface —
  web UI, hardware knobs, and Claude/MCP.
url: "https://github.com/open-horizon-labs/unified-hifi-control"
arch:
  - amd64
  - aarch64
init: false

# Starts alongside other network-dependent add-ons/services rather than
# in the earlier "system" stage.
startup: services

# Roon SOOD discovery and mDNS (LMS/UPnP/OpenHome/Chromecast) rely on
# broadcast/multicast traffic on the LAN segment. Bridge networking hides
# the container behind Docker NAT and breaks discovery, so the add-on
# needs the host's network namespace directly. No `ports`/`ports_description`
# mapping is declared because host_network makes the container bind port
# 8088 straight to the host — Supervisor port mapping does not apply.
host_network: true

# No extra `map` entries: the add-on only needs its own private /data
# directory (always mounted by the Supervisor), which is where
# UHC_CONFIG_DIR persists settings and provider pairings — see Dockerfile.

# Tier 2 (#581): embed the UHC web UI inside the Home Assistant dashboard.
# The Supervisor's ingress proxy connects to the add-on (host network) on
# ingress_port and forwards requests with an X-Ingress-Path header; UHC
# rewrites its HTML/URLs for that prefix when run.sh sets UHC_INGRESS=1.
# ingress_port is a fixed value because this add-on has no bashio to
# discover a dynamic port — it must match the `port` option (default 8088).
# Changing `port` therefore breaks the embedded panel (direct mode keeps
# working); see DOCS.md.
ingress: true
ingress_port: 8088
panel_icon: mdi:music-box-multiple
panel_title: Hi-Fi Control

# MQTT auto-configuration (#605). "want" (rather than "need") means the
# Supervisor hands over the broker's host/port/credentials when an MQTT
# broker add-on such as Mosquitto is installed, but the add-on still
# installs and starts normally when one is not — UHC's web UI, knobs, and
# MCP surface do not depend on MQTT. run.sh reads the service over the
# Supervisor API and exports it as UHC_MQTT_*; see DOCS.md.
services:
  - mqtt:want

options:
  port: 8088
  log_level: info
  require_controller_auth: false
  publish_to_home_assistant: true

schema:
  port: port
  log_level: list(trace|debug|info|warn|error)
  require_controller_auth: bool
  publish_to_home_assistant: bool
