# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Unified Hi-Fi Control
version: "3.7.0-alpha.8"
slug: unified_hifi_control
description: >-
  Bridge Roon, LMS, UPnP/OpenHome, and HQPlayer to one control surface —
  web UI, hardware knobs, and Claude/MCP.
url: "https://github.com/open-horizon-labs/unified-hifi-control"
arch:
  - amd64
  - aarch64
init: false

# Starts alongside other network-dependent add-ons/services rather than
# in the earlier "system" stage.
startup: services

# Roon SOOD discovery and mDNS (LMS/UPnP/OpenHome/Chromecast) rely on
# broadcast/multicast traffic on the LAN segment. Bridge networking hides
# the container behind Docker NAT and breaks discovery, so the add-on
# needs the host's network namespace directly. No `ports`/`ports_description`
# mapping is declared because host_network makes the container bind port
# 8088 straight to the host — Supervisor port mapping does not apply.
host_network: true

# The add-on's own private /data directory is always mounted by the
# Supervisor and is where UHC_CONFIG_DIR persists settings and provider
# pairings — see Dockerfile.
#
# `homeassistant_config` (#613) mounts Home Assistant's own configuration
# directory at /homeassistant. An add-on cannot register entities — only an
# integration running inside Home Assistant core can — but it can put that
# integration where core will find it. run.sh copies
# custom_components/unified_hifi_control (baked into the UHC image this
# add-on is built FROM) into /homeassistant/custom_components on start, so
# installing the add-on and restarting Home Assistant once is the whole
# setup: no HACS, no copying files over Samba, no MQTT broker.
#
# Write access is what the copy needs; there is nothing else in Home
# Assistant's config directory this add-on reads or touches. If the mount is
# missing or read-only, run.sh logs one line and UHC starts anyway.
#
# This is the modern object form of `map` (Supervisor 2023.x+); the older
# `homeassistant_config:rw` string form still parses but is not what the
# current docs specify.
map:
  - type: homeassistant_config
    read_only: false

# Tier 2 (#581): embed the UHC web UI inside the Home Assistant dashboard.
# The Supervisor's ingress proxy connects to the add-on (host network) on
# ingress_port and forwards requests with an X-Ingress-Path header; UHC
# rewrites its HTML/URLs for that prefix when run.sh sets UHC_INGRESS=1.
# ingress_port is a fixed value because this add-on has no bashio to
# discover a dynamic port — it must match the `port` option (default 8088).
# Changing `port` therefore breaks the embedded panel (direct mode keeps
# working); see DOCS.md.
ingress: true
ingress_port: 8088
panel_icon: mdi:music-box-multiple
panel_title: Hi-Fi Control

# MQTT broker hand-off (#605, re-scoped by #613). MQTT is no longer how this
# add-on gets zones into Home Assistant — the integration installed above is
# — so the Supervisor's broker details are now only *filled in* for the user.
# UHC leaves the publisher switched off under the add-on until someone turns
# it on deliberately. Existing installs that already had it running keep
# running; see DOCS.md.
#
# "want" (rather than "need") means the
# Supervisor hands over the broker's host/port/credentials when an MQTT
# broker add-on such as Mosquitto is installed, but the add-on still
# installs and starts normally when one is not — UHC's web UI, knobs, and
# MCP surface do not depend on MQTT. run.sh reads the service over the
# Supervisor API and exports it as UHC_MQTT_*; see DOCS.md.
services:
  - mqtt:want

# Read-only access to Home Assistant's own REST API through the Supervisor
# proxy (#610), so the add-on can answer one question it otherwise cannot:
# is Home Assistant's MQTT integration actually set up?
#
# Handing UHC the broker (above) only builds half the bridge. The other half
# - adding the MQTT integration in Home Assistant - is a manual step, and
# skipping it is invisible from the broker side: UHC connects, publishes
# every zone, and Home Assistant shows nothing at all. With this flag UHC
# can GET http://supervisor/core/api/config with SUPERVISOR_TOKEN and check
# whether "mqtt" is among the loaded components, then say so in Settings
# instead of reporting a success nobody is receiving.
#
# `homeassistant_api` (not `hassio_api`) is the flag for the core API proxy.
# Without it the request comes back 401 and UHC reports "can't tell" rather
# than guessing - so this is the difference between a useful answer and an
# honest shrug, never between a warning and a false alarm.
homeassistant_api: true

options:
  port: 8088
  log_level: info
  require_controller_auth: false
  install_integration: true
  publish_to_home_assistant: true

schema:
  port: port
  log_level: list(trace|debug|info|warn|error)
  require_controller_auth: bool
  install_integration: bool
  publish_to_home_assistant: bool
