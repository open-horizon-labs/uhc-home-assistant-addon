# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-dockerfile
#
# The Supervisor builds this add-on locally at install time. build_from is
# the already-published, multi-arch `muness/unified-hifi-control` image —
# Docker resolves the right platform layer automatically, so both arches
# point at the same tag. Bump this tag whenever config.yaml's `version`
# tracks a new unified-hifi-control release (see docs/gh-release.md in the
# main repo).
# NOTE (Tier 2 / ingress): the pinned tag must be a release that includes
# unified-hifi-control#581 (UHC_INGRESS base-path support) — do not merge
# this to main before that image tag exists on Docker Hub.
build_from:
  amd64: docker.io/muness/unified-hifi-control:3.7.0-alpha.9
  aarch64: docker.io/muness/unified-hifi-control:3.7.0-alpha.9
labels:
  org.opencontainers.image.title: Unified Hi-Fi Control
  org.opencontainers.image.description: >-
    Home Assistant add-on wrapper for the Unified Hi-Fi Control bridge
    (Roon, LMS, UPnP/OpenHome, HQPlayer).
  org.opencontainers.image.source: https://github.com/open-horizon-labs/uhc-home-assistant-addon
  org.opencontainers.image.licenses: PolyForm-Noncommercial-1.0.0
